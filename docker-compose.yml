services:
  db:
    image: postgres:latest
    container_name: lms-db
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - lms_pgdata:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  api:
    build:
      context: .
      dockerfile: PRN232.LMS.API/Dockerfile
    container_name: lms-api
    environment:
      DATABASE_URL: Host=db;Port=5432;Database=lms;Username=postgres;Password=123456
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: "CHANGE_THIS_TO_A_STRONG_SECRET_IN_PRODUCTION_32CHARS"
      Jwt__Issuer: "lms-api"
      Jwt__Audience: "lms-client"
      Jwt__ExpiresInSeconds: "3600"
    ports:
      - "5210:8080"
    depends_on:
      - db

volumes:
  lms_pgdata:
